name = "severkey"
main = "worker.js"
compatibility_date = "2024-09-01"

# NOTE: Configure Bindings in Cloudflare Dashboard:
# 1. Storage -> KV -> Create namespace: LICENSE_KV
# 2. Workers & Pages -> severkey -> Settings -> Bindings -> Add KV namespace:
#    - Variable name: LICENSE_KV
#    - Select your namespace
# 3. Settings -> Variables and Secrets:
#    - Add Secret: RSA_PRIVATE_KEY (content of rsa_private_key.pem)
#    - Add Variable: ADMIN_SECRET (your password)
#
# If you prefer to specify the KV ID in this file instead, uncomment below with your real ID:
# [[kv_namespaces]]
# binding = "LICENSE_KV"
# id = "PASTE_YOUR_32_HEX_CHAR_KV_ID_HERE"
